# "learning" profile (see zipkin-server.yml): overrides Zipkin's zipkin-server-shared.yml, which defines
# every setting and its env var (QUERY_PORT, STORAGE_TYPE, ...).
zipkin:
  discovery:
    eureka:
      # Registers as ZIPKIN-SERVER in eureka-server; same shared Basic credentials as the other modules.
      # A single URI (no comma list like the Spring clients' defaultZone): eureka-server-1 (localhost:8761), which replicates to -2.
      service-url: ${EUREKA_SERVICE_URL:http://${ACTUATOR_USER:admin}:${ACTUATOR_PASSWORD:admin}@localhost:8761/eureka}
      app-name: ${EUREKA_APP_NAME:zipkin-server}

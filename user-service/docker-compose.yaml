# Postgres for user-service, started automatically by spring-boot-docker-compose on application startup.
# spring.docker.compose.file=user-service/docker-compose.yaml points here, relative to the working directory (repo
# root for IntelliJ run configs and spring-boot:run). Its own compose project keeps it apart from the other
# modules' databases. Boot reads the mapped port, so no datasource URL is configured.
name: user-db

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
    ports:
      - "5434:5432"   # 5434 on the host: 5433 is order-service's Postgres

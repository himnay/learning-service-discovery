spring:
  application:
    name: user-service

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,metrics,loggers,threaddump,heapdump,mappings,beans,configprops
  endpoint:
    health:
      show-details: always

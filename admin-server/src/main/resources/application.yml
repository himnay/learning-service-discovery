server:
  port: 8084
  shutdown: graceful   # Boot 3.4+ default, explicit here: finish in-flight requests (max spring.lifecycle.timeout-per-shutdown-phase, 30 s) before stopping

spring:
  application:
    name: admin-server
  security:
    user: # actuator Basic auth AND the SBA UI login form
      name: ${ACTUATOR_USER:admin}
      password: ${ACTUATOR_PASSWORD:admin}
      roles: ACTUATOR
  boot:
    admin:
      ui:
        remember-me-enabled: false          # reactive Spring Security has no rememberMe(); hide the checkbox
      instance-auth: # Basic auth SBA sends when polling each instance's actuator:
        enabled: true                       # metadata user.name/user.password wins, these are the fallback
        default-user-name: ${spring.security.user.name}
        default-password: ${spring.security.user.password}

app:
  security:
    # SBA assets and /login stay in SecurityConfig: they depend on the SBA context path
    public-paths: # reachable without auth; everything else needs Basic/form login
      - "/actuator/health/**"
      - "/actuator/info"
      - "/error"

eureka:
  client:
    service-url:
      defaultZone: http://${spring.security.user.name}:${spring.security.user.password}@localhost:8761/eureka/,http://${spring.security.user.name}:${spring.security.user.password}@127.0.0.1:8762/eureka/
  instance:
    lease-renewal-interval-in-seconds: 10      # heartbeat every 10 s (default 30)
    lease-expiration-duration-in-seconds: 30   # evicted 30 s after the last heartbeat (default 90)
    prefer-ip-address: true
    metadata-map: # read by SBA's BasicAuthHttpHeaderProvider (SBA discovers itself too)
      user.name: ${spring.security.user.name}
      user.password: ${spring.security.user.password}
      tags.environment: ${APP_ENV:local}   # SBA shows tags.* as badges in the application list
      tags.tier: infra

info: # published by /actuator/info (needs management.info.env.enabled) → SBA Details → Info
  app:
    name: ${spring.application.name}
    description: Spring Boot Admin dashboard (discovers instances via Eureka)
    tier: infra
    environment: ${APP_ENV:local}

logging:
  file:
    name: logs/${spring.application.name}.log   # enables /actuator/logfile (SBA Logfile view)

management:
  info: # extra contributors shown in SBA Details → Info
    env:
      enabled: true       # info.* properties above
    java:
      enabled: true       # JDK vendor/version, JVM
    os:
      enabled: true       # OS name/version/arch
    process:
      enabled: true       # PID, CPUs, memory
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - heapdump
          - logfile
          - env
          - shutdown
          - restart
          - refresh
          - metrics
          - loggers
          - threaddump
          - configprops
          - beans
          - mappings
          - httpexchanges   # InMemoryHttpExchangeRepository (ActuatorConfig)
          - startup         # BufferingApplicationStartup (AdminServerApplication)
          - auditevents     # InMemoryAuditEventRepository: SBA UI logins show up here
          - sbom            # cyclonedx-maven-plugin output
          - quartz          # HeartbeatJob
          # no jolokia: SBA 4 server is WebFlux-only, jolokia-support-springboot needs servlet
  endpoint:
    shutdown:
      access: unrestricted   # SBA "Shutdown" button
    restart:
      access: unrestricted   # SBA "Restart" button (Spring Cloud Context)
    refresh:
      access: unrestricted   # SBA "Refresh" on Environment: re-binds @ConfigurationProperties / @RefreshScope
    env:
      post:
        enabled: true        # SBA Environment "Update" form (POST /actuator/env, Spring Cloud Context)
    health:
      show-details: always
      probes:
        enabled: true     # /actuator/health/liveness + /readiness groups (SBA Details → Health)
    heapdump:
      access: unrestricted

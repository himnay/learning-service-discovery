# Peer 2 of 2 — eureka-server-1 is the same code with port 8761 and the peer URL flipped.
# Peers must have distinct hostnames — Eureka skips any peer URL whose host equals its own (the port is
# ignored) — so node 1 is "localhost" and node 2 "127.0.0.1": both resolve everywhere, no /etc/hosts entry.
server:
  port: 8762
  shutdown: graceful   # Boot 3.4+ default, explicit here: finish in-flight requests (max spring.lifecycle.timeout-per-shutdown-phase, 30 s) before stopping

spring:
  application:
    name: eureka-server   # same app name on both peers: one EUREKA-SERVER app with 2 instances (dashboard replica check needs it)
  security:
    user:
      name: ${ACTUATOR_USER:admin}
      password: ${ACTUATOR_PASSWORD:admin}
      roles: ACTUATOR
  quartz:
    job-store-type: memory

app:
  security:
    public-paths: # reachable without auth; everything else needs Basic/form login
      - "/actuator/health/**"
      - "/actuator/health"
      - "/actuator/info"
      - "/error"

eureka:
  environment: ${EUREKA_ENVIRONMENT:SIT}   # dashboard header "Environment" (default: test)
  datacenter: ${EUREKA_DATACENTER:TX}      # dashboard header "Data center" (default: default)
  instance:
    lease-renewal-interval-in-seconds: 10      # heartbeat every 10 s (default 30)
    lease-expiration-duration-in-seconds: 30   # evicted 30 s after the last heartbeat (default 90)
    hostname: 127.0.0.1
    metadata-map:
      # SBA discovers this node from the registry and polls /actuator with these credentials
      user.name: ${spring.security.user.name}
      user.password: ${spring.security.user.password}
      tags.environment: ${APP_ENV:local}   # SBA shows tags.* as badges in the application list
      tags.tier: infra
  client:
    # register with the peer (so SBA lists the registry too) and replicate through it
    register-with-eureka: true
    fetch-registry: true   # on startup this node copies its registry from the peer; without it a restart comes up empty
    service-url:
      defaultZone: http://${spring.security.user.name}:${spring.security.user.password}@localhost:8761/eureka/
  server:
    # on everywhere: a network blip can't mass-evict the registry (and the dashboard drops the
    # "SELF PRESERVATION MODE IS TURNED OFF" banner); EUREKA_SELF_PRESERVATION=false to opt out
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    # self-preservation trips below this share of expected renewals; 0.5 locally so killing one or two
    # services in a ~8-instance demo still evicts them (prod profile: 0.85)
    renewal-percent-threshold: ${EUREKA_RENEWAL_THRESHOLD:0.5}
    expected-client-renewal-interval-seconds: 10                  # must match clients' lease-renewal-interval-in-seconds
    eviction-interval-timer-in-ms: 30000                          # eviction sweep every 30 s (default 60 s)

info: # published by /actuator/info (needs management.info.env.enabled) → SBA Details → Info
  app:
    name: ${spring.application.name}
    description: Eureka service registry
    tier: infra
    environment: ${APP_ENV:local}

logging:
  file:
    name: logs/eureka-server-2.log   # enables /actuator/logfile (SBA Logfile view)

management:
  info: # extra contributors shown in SBA Details → Info
    env:
      enabled: true       # info.* properties above
    java:
      enabled: true       # JDK vendor/version, JVM
    os:
      enabled: true       # OS name/version/arch
    process:
      enabled: true       # PID, CPUs, memory
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - heapdump
          - logfile
          - env
          - shutdown
          - restart
          - refresh
          - metrics
          - loggers
          - threaddump
          - configprops
          - beans
          - mappings
          - httpexchanges
          - startup
          - auditevents
          - sbom
          - quartz
          - jolokia
  endpoint:
    shutdown:
      access: unrestricted   # SBA "Shutdown" button
    restart:
      access: unrestricted   # SBA "Restart" button (Spring Cloud Context)
    refresh:
      access: unrestricted   # SBA "Refresh" on Environment: re-binds @ConfigurationProperties / @RefreshScope
    env:
      post:
        enabled: true        # SBA Environment "Update" form (POST /actuator/env, Spring Cloud Context)
    health:
      show-details: always
      probes:
        enabled: true     # /actuator/health/liveness + /readiness groups (SBA Details → Health)
    heapdump:
      access: unrestricted